; Pro1X: the N9's blanco theme dark everywhere, for the AMOLED panel: pure
; black (#000000, the pixels off) behind every page instead of blanco's
; light grey, light texts on it. Only the palette changes; blanco's images
; and everything else are inherited (X-Inherits=blanco in index.theme).
[Palette]
COLOR_FOREGROUND            = #ffffff ;text color
COLOR_SECONDARY_FOREGROUND  = #c8c8c8 ;secondary text
COLOR_BACKGROUND            = #000000 ;background
BACKGROUND_PORTRAIT         = none;
BACKGROUND_LANDSCAPE        = none;
COLOR_INVERTED_BACKGROUND   = #000000 ;background
BACKGROUND_INVERTED_PORTRAIT  = none;
BACKGROUND_INVERTED_LANDSCAPE = none;
