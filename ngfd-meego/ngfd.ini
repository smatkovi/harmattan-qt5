# ngfd (Nemo's, github.com/sailfishos/ngfd) for the MeeGo look: the plugins
# that run without Harmattan's profiled and ohm (no profile, route or
# streamrestore plugin); the events in events.d are the N9's own, from an
# N9 or N950 root file system (/usr/share/ngfd/events.d, Nokia's).
[general]
plugins = dbus;transform;resource;tonegen;canberra;gst;callstate
plugins-optional = ffmemless;mce;devicelock
sink-order = gst

[keytypes]
core.max_timeout = INTEGER
